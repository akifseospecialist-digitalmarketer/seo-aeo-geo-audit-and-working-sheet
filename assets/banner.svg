<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="SEO · AEO · GEO Audit and Working Sheet — one prompt, full audit, one 16-tab Excel workbook">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1c"/>
      <stop offset="0.55" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#101a3a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;600 0;0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#a78bfa" stop-opacity=".40"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC"><stop offset="0" stop-color="#34d399" stop-opacity=".30"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="400" rx="22"/></clipPath>
  </defs>

  <style>
    .f { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .fade1 { opacity: 0; animation: fade .9s ease-out .2s forwards; }
    .fade2 { opacity: 0; animation: fade .9s ease-out .6s forwards; }
    .fade3 { opacity: 0; animation: fade .9s ease-out 1.0s forwards; }
    .fade4 { opacity: 0; animation: fade .9s ease-out 1.4s forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .float { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 7s ease-in-out -2s infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 3.2s ease-in-out infinite; }
    .b2 { animation-delay: .25s; } .b3 { animation-delay: .5s; } .b4 { animation-delay: .75s; } .b5 { animation-delay: 1s; }
    @keyframes grow { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    .scan { animation: scan 3.5s ease-in-out infinite; }
    @keyframes scan { 0%,100% { transform: translate(0,0); } 25% { transform: translate(60px,30px); } 50% { transform: translate(110px,95px); } 75% { transform: translate(30px,120px); } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .row { opacity: 0; animation: rowin 6s ease-out infinite; }
    .r2 { animation-delay: .4s; } .r3 { animation-delay: .8s; } .r4 { animation-delay: 1.2s; } .r5 { animation-delay: 1.6s; }
    @keyframes rowin { 0% { opacity: 0; } 10%,85% { opacity: 1; } 100% { opacity: 0; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>

    <circle r="220" fill="url(#orbA)">
      <animate attributeName="cx" values="120;260;120" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;140;60" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="260" fill="url(#orbB)">
      <animate attributeName="cx" values="1050;900;1050" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="360;260;360" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle r="180" fill="url(#orbC)">
      <animate attributeName="cx" values="640;720;640" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="420;330;420" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- Left: text -->
    <g class="f">
      <g class="fade1">
        <rect x="70" y="62" width="246" height="30" rx="15" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/>
        <circle cx="90" cy="77" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
        <text x="104" y="82" font-size="14" font-weight="600" fill="#a5f3fc" letter-spacing=".5">AI-AGENT PROMPT · v1.0</text>
      </g>
      <text class="fade2" x="68" y="160" font-size="66" font-weight="800" fill="url(#title)" letter-spacing="-1">SEO · AEO · GEO</text>
      <text class="fade3" x="70" y="212" font-size="38" font-weight="700" fill="#f8fafc">Audit &amp; Working Sheet</text>
      <text class="fade4" x="70" y="258" font-size="19" fill="#94a3b8">One prompt  →  full audit  →  one 16-tab Excel workbook</text>

      <g class="fade4 mono" font-size="14" font-weight="600">
        <rect x="70" y="292" width="148" height="36" rx="10" fill="#0f172a" stroke="#334155"/>
        <text x="88" y="315" fill="#22d3ee">24</text><text x="114" y="315" fill="#cbd5e1">tech checks</text>
        <rect x="230" y="292" width="122" height="36" rx="10" fill="#0f172a" stroke="#334155"/>
        <text x="248" y="315" fill="#a78bfa">16</text><text x="274" y="315" fill="#cbd5e1">tabs</text>
        <rect x="364" y="292" width="160" height="36" rx="10" fill="#0f172a" stroke="#334155"/>
        <text x="382" y="315" fill="#34d399">5</text><text x="400" y="315" fill="#cbd5e1">AI engines</text>
      </g>
    </g>

    <!-- Right: animated workbook card -->
    <g class="float" transform="translate(0,0)">
      <g transform="translate(700,70)">
        <rect width="420" height="262" rx="16" fill="#0b1324" stroke="#334155"/>
        <rect width="420" height="40" rx="16" fill="#111c33"/>
        <rect y="24" width="420" height="16" fill="#111c33"/>
        <circle cx="22" cy="20" r="6" fill="#f87171"/><circle cx="42" cy="20" r="6" fill="#fbbf24"/><circle cx="62" cy="20" r="6" fill="#34d399"/>
        <text x="92" y="25" class="mono" font-size="13" fill="#94a3b8">audit-working-sheet.xlsx</text>

        <!-- header -->
        <rect x="18" y="56" width="384" height="26" rx="5" fill="#1e293b"/>
        <g class="f" font-size="12" font-weight="700" fill="#cbd5e1">
          <text x="30" y="74">Test</text><text x="200" y="74">Status</text><text x="300" y="74">Fix</text>
        </g>
        <!-- rows -->
        <g class="f" font-size="12" fill="#e2e8f0">
          <g class="row"><text x="30" y="104">Redirection</text><rect x="196" y="91" width="62" height="18" rx="9" fill="#065f46"/><text x="208" y="104" fill="#6ee7b7" font-weight="700">PASS</text><rect x="300" y="96" width="80" height="8" rx="4" fill="#334155"/></g>
          <g class="row r2"><text x="30" y="132">Title tags</text><rect x="196" y="119" width="62" height="18" rx="9" fill="#78350f"/><text x="204" y="132" fill="#fcd34d" font-weight="700">WARN</text><rect x="300" y="124" width="64" height="8" rx="4" fill="#334155"/></g>
          <g class="row r3"><text x="30" y="160">Schema</text><rect x="196" y="147" width="62" height="18" rx="9" fill="#7f1d1d"/><text x="210" y="160" fill="#fca5a5" font-weight="700">FAIL</text><rect x="300" y="152" width="90" height="8" rx="4" fill="#334155"/></g>
          <g class="row r4"><text x="30" y="188">llms.txt</text><rect x="196" y="175" width="62" height="18" rx="9" fill="#7f1d1d"/><text x="210" y="188" fill="#fca5a5" font-weight="700">FAIL</text><rect x="300" y="180" width="70" height="8" rx="4" fill="#334155"/></g>
          <g class="row r5"><text x="30" y="216">AI crawlers</text><rect x="196" y="203" width="62" height="18" rx="9" fill="#065f46"/><text x="208" y="216" fill="#6ee7b7" font-weight="700">PASS</text><rect x="300" y="208" width="56" height="8" rx="4" fill="#334155"/></g>
        </g>
        <!-- tab strip -->
        <g class="f" font-size="10" font-weight="600">
          <rect x="18" y="232" width="62" height="18" rx="4" fill="#22d3ee"/><text x="26" y="245" fill="#0b1324">Summary</text>
          <rect x="84" y="232" width="56" height="18" rx="4" fill="#1e293b"/><text x="92" y="245" fill="#94a3b8">Audit</text>
          <rect x="144" y="232" width="58" height="18" rx="4" fill="#1e293b"/><text x="152" y="245" fill="#94a3b8">Meta</text>
          <rect x="206" y="232" width="58" height="18" rx="4" fill="#1e293b"/><text x="214" y="245" fill="#94a3b8">AEO</text>
          <rect x="268" y="232" width="58" height="18" rx="4" fill="#1e293b"/><text x="276" y="245" fill="#94a3b8">GEO</text>
          <rect x="330" y="232" width="72" height="18" rx="4" fill="#1e293b"/><text x="338" y="245" fill="#94a3b8">+11 more</text>
        </g>
      </g>
    </g>

    <!-- Health score bubble -->
    <g class="float2">
      <g transform="translate(1078,14)">
        <circle cx="48" cy="48" r="46" fill="#0b1324" stroke="#334155"/>
        <circle cx="48" cy="48" r="36" fill="none" stroke="#1e293b" stroke-width="8"/>
        <circle cx="48" cy="48" r="36" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-dasharray="226" stroke-dashoffset="226" transform="rotate(-90 48 48)">
          <animate attributeName="stroke-dashoffset" values="226;68;68;226" keyTimes="0;.4;.85;1" dur="6s" repeatCount="indefinite"/>
        </circle>
        <text x="48" y="46" text-anchor="middle" class="f" font-size="11" fill="#94a3b8">HEALTH</text>
        <text x="48" y="62" text-anchor="middle" class="f" font-size="16" font-weight="800" fill="#f8fafc">SCORE</text>
      </g>
    </g>

    <!-- Mini bars -->
    <g transform="translate(626,250)">
      <rect class="bar" x="0" y="0" width="12" height="70" rx="3" fill="#22d3ee" opacity=".85"/>
      <rect class="bar b2" x="18" y="0" width="12" height="70" rx="3" fill="#a78bfa" opacity=".85"/>
      <rect class="bar b3" x="36" y="0" width="12" height="70" rx="3" fill="#34d399" opacity=".85"/>
      <rect class="bar b4" x="54" y="0" width="12" height="70" rx="3" fill="#22d3ee" opacity=".6"/>
    </g>

    <!-- Magnifier scanning the sheet -->
    <g class="scan">
      <g transform="translate(760,120)">
        <circle cx="0" cy="0" r="22" fill="#22d3ee" fill-opacity=".08" stroke="#a5f3fc" stroke-width="3"/>
        <line x1="16" y1="16" x2="32" y2="32" stroke="#a5f3fc" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
