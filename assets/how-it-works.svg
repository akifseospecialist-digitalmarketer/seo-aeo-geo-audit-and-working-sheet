<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="How it works: fill client inputs, the AI agent pulls live data, it runs the full audit, and you get one 16-tab Excel working sheet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1c"/><stop offset="1" stop-color="#0f1a36"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="300" rx="22"/></clipPath>
  </defs>
  <style>
    .f { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .dash { stroke-dasharray: 8 10; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -36; } }
    .card { animation: glow 6s ease-in-out infinite; }
    .c2 { animation-delay: 1.5s; } .c3 { animation-delay: 3s; } .c4 { animation-delay: 4.5s; }
    @keyframes glow { 0%,30%,100% { stroke: #334155; stroke-width: 1.5; } 10%,20% { stroke: #22d3ee; stroke-width: 3; } }
    .pop { animation: pop 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .p2 { animation-delay: 1.5s; } .p3 { animation-delay: 3s; } .p4 { animation-delay: 4.5s; }
    @keyframes pop { 0%,30%,100% { transform: scale(1); } 15% { transform: scale(1.18); } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <text x="600" y="44" text-anchor="middle" class="f" font-size="15" font-weight="700" fill="#94a3b8" letter-spacing="3">HOW IT WORKS</text>

    <!-- connectors -->
    <g fill="none" stroke-width="3" stroke-linecap="round">
      <path class="dash" stroke="#22d3ee" d="M294 145 H330"/>
      <path class="dash" stroke="#a78bfa" d="M574 145 H630"/>
      <path class="dash" stroke="#fbbf24" d="M874 145 H910"/>
    </g>
    <g fill="#a78bfa">
      <path d="M330 138 l10 7 -10 7z" fill="#22d3ee"/><path d="M630 138 l10 7 -10 7z" fill="#a78bfa"/><path d="M910 138 l10 7 -10 7z" fill="#fbbf24"/>
    </g>
    <!-- travelling dot -->
    <circle r="6" fill="#f8fafc">
      <animateMotion dur="6s" repeatCount="indefinite" path="M165 230 H1035"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.95;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <rect x="165" y="229" width="870" height="3" rx="1.5" fill="url(#flow)" opacity=".35"/>

    <g class="f">
      <!-- 1 -->
      <rect class="card" x="40" y="80" width="250" height="130" rx="16" fill="#0b1324" stroke="#334155"/>
      <g class="pop"><circle cx="82" cy="122" r="22" fill="#22d3ee" fill-opacity=".15"/><text x="82" y="129" text-anchor="middle" font-size="20">📝</text></g>
      <text x="116" y="118" font-size="12" font-weight="700" fill="#22d3ee">STEP 1</text>
      <text x="116" y="138" font-size="18" font-weight="700" fill="#f8fafc">Fill inputs</text>
      <text x="60" y="172" font-size="13" fill="#94a3b8">17 fields — business, services,</text>
      <text x="60" y="190" font-size="13" fill="#94a3b8">area, competitors, tools</text>

      <!-- 2 -->
      <rect class="card c2" x="340" y="80" width="230" height="130" rx="16" fill="#0b1324" stroke="#334155"/>
      <g class="pop p2"><circle cx="382" cy="122" r="22" fill="#a78bfa" fill-opacity=".15"/><text x="382" y="129" text-anchor="middle" font-size="20">🤖</text></g>
      <text x="416" y="118" font-size="12" font-weight="700" fill="#a78bfa">STEP 2</text>
      <text x="416" y="138" font-size="18" font-weight="700" fill="#f8fafc">Agent pulls data</text>
      <text x="360" y="172" font-size="13" fill="#94a3b8">Crawl, keywords, SERPs,</text>
      <text x="360" y="190" font-size="13" fill="#94a3b8">backlinks, AI answers</text>

      <!-- 3 -->
      <rect class="card c3" x="640" y="80" width="230" height="130" rx="16" fill="#0b1324" stroke="#334155"/>
      <g class="pop p3"><circle cx="682" cy="122" r="22" fill="#fbbf24" fill-opacity=".15"/><text x="682" y="129" text-anchor="middle" font-size="20">🔍</text></g>
      <text x="716" y="118" font-size="12" font-weight="700" fill="#fbbf24">STEP 3</text>
      <text x="716" y="138" font-size="18" font-weight="700" fill="#f8fafc">Full audit</text>
      <text x="660" y="172" font-size="13" fill="#94a3b8">Technical · On-page · Area</text>
      <text x="660" y="190" font-size="13" fill="#94a3b8">Off-page · AEO · GEO · AI</text>

      <!-- 4 -->
      <rect class="card c4" x="920" y="80" width="240" height="130" rx="16" fill="#0b1324" stroke="#334155"/>
      <g class="pop p4"><circle cx="962" cy="122" r="22" fill="#34d399" fill-opacity=".15"/><text x="962" y="129" text-anchor="middle" font-size="20">📊</text></g>
      <text x="996" y="118" font-size="12" font-weight="700" fill="#34d399">STEP 4</text>
      <text x="996" y="138" font-size="18" font-weight="700" fill="#f8fafc">Working sheet</text>
      <text x="940" y="172" font-size="13" fill="#94a3b8">16 tabs, live formulas,</text>
      <text x="940" y="190" font-size="13" fill="#94a3b8">90-day action plan</text>
    </g>

    <text x="600" y="272" text-anchor="middle" class="f" font-size="13" fill="#64748b">No invented numbers — anything that can't be measured is marked “Check” with the manual step</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
